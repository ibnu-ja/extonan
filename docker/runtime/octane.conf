[supervisord]
nodaemon = true
user = %(ENV_SUPERVISOR_PHP_USER)s

[supervisorctl]

[inet_http_server]
port = 127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:octane]
process_name = %(program_name)s_%(process_num)s
command = php /app/artisan octane:frankenphp --host=0.0.0.0 --port=80 --admin-host=0.0.0.0 --admin-port=2019 --caddyfile=/etc/caddy/Caddyfile
user = %(ENV_SUPERVISOR_PHP_USER)s
priority = 1
autostart = true
autorestart = true
stopwaitsecs = 30
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
